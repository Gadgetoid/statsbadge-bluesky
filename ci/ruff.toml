# The rules statsbadge itself is checked against, minus the badge builtins: nothing here
# runs on the badge.

lint.select = [
    "F",
    "Q",
    "W",
    "E",
    "B",
    "COM",
    "BLE",
    "C4",
    "ISC",
    "ICN",
    "PIE",
    "RSE",
    "RET",
    "SLF",
    "ARG"
]

lint.ignore = [
    "E501",
    "E402",
    "COM812",
    "ICN001"
]

lint.extend-select = ["UP"]

[lint.per-file-ignores]
# A source wraps whatever it reads: a feed that is down degrades to a missing field, the
# contract in sources/base.py. `dt` is in the sample() signature whether or not a source
# needs a rate.
"src/statsbadge_bluesky/__init__.py" = ["BLE001", "ARG002"]
