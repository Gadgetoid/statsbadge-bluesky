[project]
name = "statsbadge-bluesky"
dynamic = ["version"]
description = "A Bluesky account, its posts and a feed as statsbadge readings"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge>=1.1.0"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge-bluesky"
Repository = "https://github.com/pimoroni/statsbadge-bluesky"
Issues = "https://github.com/pimoroni/statsbadge-bluesky/issues"

# The whole extension mechanism is this one entry point:
[project.entry-points."statsbadge.sources"]
bluesky = "statsbadge_bluesky:Bluesky"

# The tag is the version.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge_bluesky"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
